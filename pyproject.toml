[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de atendimento e cotacao da AutoSeguro (desafio FDE Namastex)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
silver = [
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["quote-service", "scripts/generate_dataset.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
